<div class="brand">
  <app-icon class="brand-icon" name="leaf" />
  @if (!collapsed()) {
    <span class="brand-name">Plant Encyclopedia</span>
  }
</div>

@if (showCollapseToggle()) {
  <button
    type="button"
    class="icon-button collapse-toggle"
    [attr.aria-expanded]="!collapsed()"
    [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
    (click)="toggleCollapsed.emit()"
  >
    <app-icon [name]="collapsed() ? 'chevrons-right' : 'chevrons-left'" />
  </button>
}

<nav aria-label="Main">
  <ul class="nav-list">
    @for (item of items; track item.path) {
      <li>
        <a
          class="nav-item"
          [routerLink]="item.path"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          [attr.aria-label]="collapsed() ? item.label : null"
          [attr.title]="collapsed() ? item.label : null"
          (click)="navigate.emit()"
        >
          <app-icon class="nav-icon" [name]="item.icon" />
          @if (!collapsed()) {
            <span class="nav-label">{{ item.label }}</span>
          }
        </a>
      </li>
    }
  </ul>
</nav>

<!-- Authentication is not implemented yet, so the account entry is a disabled placeholder. -->
<button type="button" class="nav-item account" disabled [attr.aria-label]="collapsed() ? 'Login' : null">
  <app-icon class="nav-icon" name="user" />
  @if (!collapsed()) {
    <span class="nav-label">Login</span>
  }
</button>

<header class="bar">
  <button
    type="button"
    class="icon-button"
    aria-label="Open menu"
    aria-haspopup="dialog"
    (click)="menuOpen.emit()"
  >
    <app-icon name="menu" />
  </button>

  <span class="title">Plant Encyclopedia</span>

  <app-theme-toggle />

  <!-- Account (D-070): the signed-in user's initial (Sign out is in the menu), or a link to sign in. -->
  @if (auth.user(); as user) {
    <span
      class="icon-button account"
      role="img"
      [attr.aria-label]="'Signed in as ' + user.displayName"
    >
      <span class="avatar" aria-hidden="true">{{ initial(user.displayName) }}</span>
    </span>
  } @else {
    <a class="icon-button" routerLink="/login" aria-label="Sign in">
      <app-icon name="user" />
    </a>
  }
</header>

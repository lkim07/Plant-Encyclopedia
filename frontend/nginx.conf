# The website in Docker (design 2026-10-27). The API runs at http://api:8080 on the stack's private network and trusts
# X-Forwarded-Proto/For only from that network (ForwardedHeaders:KnownNetworks).
server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/site.crt;
    ssl_certificate_key /etc/nginx/certs/site.key;

    root /usr/share/nginx/html;
    client_max_body_size 12m; # identification photos

    # For every request passed to the API. Replaces anything the client sent, so the API sees only what nginx saw.
    # The address the browser used (e.g. localhost:8443), so it matches Accounts:PublicBaseUrl on the sign-in routes.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;

    # Development-only image review endpoints are never reachable through the website.
    location ^~ /api/dev/ {
        return 404;
    }

    location ~ ^/(api/|health$|signin-) {
        proxy_pass http://api:8080;
    }

    # /media holds both the build's font files and the API's stored plant images: the website's own files first.
    location ^~ /media/ {
        try_files $uri @api;
    }

    location @api {
        proxy_pass http://api:8080;
    }

    # Built files have content hashes in their names.
    location ~* \.(?:js|css|woff2?|png|svg|ico|webp)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The app's own routes (e.g. /plants/...) load index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
